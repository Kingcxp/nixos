name: Build NixOS

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 安装 Nix（含 flakes）。Nix 构建是 hermetic 的：
      # toplevel 闭包在任何宿主上构建产物一致，等价于真实 NixOS 环境构建。
      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      # 求值检查（类型/选项/import 校验，快）
      - name: Flake check
        run: nix flake check --accept-flake-config

      # 真实构建整个系统闭包（内核、initrd、sudoers、全部软件）。
      # 抓 build 期错误，如 sudoers visudo 语法错误（flake check 抓不到）。
      - name: Build system toplevel
        run: nix build .#nixosConfigurations.thinkbook.config.system.build.toplevel --accept-flake-config
